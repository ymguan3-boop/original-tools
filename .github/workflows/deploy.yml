name: Deploy original-tools to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            qr-platform/client/package-lock.json
            image-audit/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install qr-platform deps
        working-directory: qr-platform/client
        run: npm ci

      - name: Build qr-platform
        working-directory: qr-platform/client
        run: npm run build

      - name: Install image-audit deps
        working-directory: image-audit
        run: npm ci

      - name: Build image-audit
        working-directory: image-audit
        run: npm run build -- --base=./

      - name: Include DOCX generator in DINOv2 desktop build
        run: |
          cp image-audit/shared/docxWriter.js image-audit/dist/docxWriter.js
          python3 - <<'PY'
          from pathlib import Path
          page=Path('image-audit/dist/index.html')
          s=page.read_text()
          assert '</head>' in s
          page.write_text(s.replace('</head>', '<script src="./docxWriter.js"></script></head>'))
          PY

      - name: Validate DOCX reports with embedded paired images
        run: |
          node image-audit/tests/test-docx.cjs

      - name: Test offline advanced geometry and SSIM (synthetic images)
        run: node image-audit/tests/test-advanced-vision.cjs

      - name: Test unified six-section AI audit narratives
        run: node image-audit/tests/test-report-standard.cjs

      - name: Test multi-folder batch import and drag-drop
        run: node image-audit/tests/test-folder-import.cjs

      - name: Test audit triage and safer photo imports
        run: node image-audit/tests/test-audit-evidence.cjs

      - name: Test browser image scoring (false positives and near duplicates)
        run: node image-audit/tests/test-comparator.cjs

      - name: Test white paper margin removal and multi-region matching
        run: node image-audit/tests/test-white-border.cjs

      - name: Test original-file input parity and desktop forensic report
        run: node image-audit/tests/test-preprocessing-parity.cjs

      - name: Test percentage definitions and parameter tables on three interfaces
        run: node image-audit/tests/test-parameter-guide.cjs

      - name: Validate PRIVATE benchmark runner syntax (real photos remain local)
        run: python3 -m py_compile image-audit/tests/private_photo_benchmark.py

      - name: Test Windows desktop HTTP route handling
        env:
          GO111MODULE: "off"
        run: go test ./image-audit/desktop -v

      - name: Build Windows DINOv2 portable launcher
        run: |
          mkdir -p image-audit/desktop-build
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o image-audit/desktop-build/啟動工程照片稽核.exe image-audit/desktop/launcher.go
          test -s image-audit/desktop-build/啟動工程照片稽核.exe

      - name: Download trusted v1.1.0 bundled DINOv2 model
        run: |
          curl -fsSL --retry 3 --retry-delay 3 --connect-timeout 20 \
            -o image-audit/desktop-build/legacy-model.zip \
            https://github.com/ymguan3-boop/original-tools/releases/download/v1.1.0/desktop-release.zip
          test -s image-audit/desktop-build/legacy-model.zip

      - name: Assemble deploy site
        run: |
          rm -rf deploy
          mkdir -p deploy/qr-platform
          mkdir -p deploy/pdf-voice-video
          mkdir -p deploy/mobile-remote-assist
          mkdir -p deploy/image-audit

          # landing page
          cp index.html deploy/index.html
          cp index.html deploy/404.html

          # qr-platform built assets
          cp -r qr-platform/client/dist/* deploy/qr-platform/
          cp deploy/qr-platform/index.html deploy/qr-platform/404.html || true

          # pdf-voice-video static (relative paths work under subpath)
          cp -r pdf-voice-video/* deploy/pdf-voice-video/
          # mobile remote assist frontend; signaling and token issuance remain server-side
          cp -r mobile-remote-assist/* deploy/mobile-remote-assist/
          # image-audit built assets (base: /original-tools/image-audit/)
          cp -r image-audit/dist/* deploy/image-audit/
          cp image-audit/shared/docx-export.js deploy/image-audit/docx-export.js
          cp image-audit/shared/comparator-core.js deploy/image-audit/comparator-core.js
          cp image-audit/shared/report-standard.js deploy/image-audit/report-standard.js
          cp image-audit/shared/multi-folder-import.js deploy/image-audit/multi-folder-import.js
          # DINOv2 is desktop-only. Online edition uses pixel and perceptual hashing.
          cp image-audit/online/index.html deploy/image-audit/index.html
          cp image-audit/selector.html deploy/image-audit/selector.html
          cp image-audit/shared/docxWriter.js deploy/image-audit/docxWriter.js
          # Ensure current online edition is also the fallback page.
          cp deploy/image-audit/index.html deploy/image-audit/404.html
          # Build a self-contained ZIP from static offline HTML (no Python needed by users).
          # Python is used only on the GitHub Actions runner to create the UTF-8 ZIP.
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          source = Path('image-audit/offline')
          output = Path('deploy/image-audit/image-audit-desktop-html-offline.zip')
          with ZipFile(output, 'w', compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for file in sorted(source.iterdir()):
                  if file.is_file():
                      archive.write(file, arcname=file.name)
              archive.write('image-audit/shared/docx-export.js', arcname='docx-export.js')
              archive.write('image-audit/shared/comparator-core.js', arcname='comparator-core.js')
              archive.write('image-audit/shared/report-standard.js', arcname='report-standard.js')
              archive.write('image-audit/shared/multi-folder-import.js', arcname='multi-folder-import.js')
              archive.write('image-audit/shared/docxWriter.js', arcname='docxWriter.js')
          assert output.stat().st_size > 1024, 'Desktop ZIP is empty'
          print('Offline HTML ZIP ready:', output, output.stat().st_size, 'bytes')
          PY
          # Build a Windows portable package with locally served DINOv2 ONNX model.
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from shutil import copyfile
          root = Path('image-audit/desktop-build')
          for asset in Path('image-audit/dist').rglob('*'):
              if asset.is_file():
                  out = root / asset.relative_to('image-audit/dist')
                  out.parent.mkdir(parents=True, exist_ok=True)
                  copyfile(asset, out)
          # Installation guide lives on selector.html; no redundant TXT in the EXE ZIP.
          (root/'使用說明.txt').unlink(missing_ok=True)
          legacy = root/'legacy-model.zip'
          model_files = 0
          onnx_files = 0
          with ZipFile(legacy) as original:
              entries = original.namelist()
              for name in entries:
                  clean = name.replace('\\', '/')
                  idx = clean.find('models/')
                  if idx < 0 or clean.endswith('/'):
                      continue
                  rel = Path(clean[idx:])
                  if '..' in rel.parts:
                      raise RuntimeError('Unsafe path in model bundle: ' + name)
                  out = root/rel
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(original.read(name))
                  model_files += 1
                  if out.suffix.lower() == '.onnx':
                      onnx_files += 1
              print('Original release model file samples:', [x for x in entries if 'models/' in x][:12])
          legacy.unlink()
          if model_files == 0 or onnx_files == 0:
              raise RuntimeError(f'Existing v1.1.0 release does not contain a DINOv2 ONNX model: models={model_files}, onnx={onnx_files}')
          assert (root/'index.html').exists()
          assert (root/'docxWriter.js').is_file(), 'Native DOCX writer required by the desktop app'
          assert (root/'report-standard.js').is_file(), 'Shared OpenRouter report module required'
          assert (root/'multi-folder-import.js').is_file(), 'Multi-folder picker required in Windows ZIP'
          assert not (root/'使用說明.txt').exists(), 'Installer TXT must not be packaged'
          assert (root/'啟動工程照片稽核.exe').stat().st_size > 100000
          output = Path('deploy/image-audit/image-audit-desktop-dinov2.zip')
          with ZipFile(output, 'w', compression=ZIP_DEFLATED, compresslevel=6) as archive:
              for file in sorted(root.rglob('*')):
                  if file.is_file():
                      archive.write(file, arcname=file.relative_to(root))
          with ZipFile(output) as archive:
              assert archive.testzip() is None, 'ZIP checksum failed'
              bundled=set(archive.namelist())
              assert 'index.html' in bundled, 'index.html is mandatory for the EXE launcher'
              assert 'docxWriter.js' in bundled, 'DOCX writer must remain bundled'
              assert 'report-standard.js' in bundled, 'Unified report formatter required in desktop ZIP'
              assert 'multi-folder-import.js' in bundled, 'Real multi-folder picker must be bundled'
              assert '使用說明.txt' not in bundled, 'Instructions have moved to selector.html'
          print('DINOv2 portable desktop ZIP:', output, output.stat().st_size, 'bytes')
          print('Bundled model files:', model_files, 'ONNX models:', onnx_files)
          PY
          # ensure .nojekyll is at deploy root and subdirs for Pages
          touch deploy/.nojekyll
          touch deploy/qr-platform/.nojekyll
          touch deploy/pdf-voice-video/.nojekyll
          touch deploy/mobile-remote-assist/.nojekyll
          touch deploy/image-audit/.nojekyll

          echo "=== deploy tree ==="
          ls -R deploy | head -n 100
          du -sh deploy/*

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
