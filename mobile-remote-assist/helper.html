<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>遠端協助工作台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-role="helper">
    <main class="shell">
      <section class="topbar"><div><p class="eyebrow">Remote Assist</p><h1>遠端協助工作台</h1><p class="creator">製作人 官毅明</p></div><button id="show-help" class="ghost help-button" type="button">使用說明</button></section>
      <section class="workspace">
        <aside class="panel control-panel">
          <label for="join-code">協助代碼</label>
          <div class="join-row"><input id="join-code" inputmode="numeric" maxlength="4" placeholder="輸入 4 位數代碼" /><button id="join-session">加入</button></div>
          <dl class="status-list"><div><dt>目前狀態</dt><dd id="session-status">尚未連線</dd></div><div><dt>分享來源</dt><dd id="stream-source">等待手機端</dd></div><div><dt>活動紀錄</dt><dd id="event-count">0</dd></div></dl>
          <button id="toggle-microphone" class="microphone-button" type="button">啟動麥克風</button>
          <button id="resume-media" type="button" hidden>播放影像與聲音</button>
          <p id="network-status" class="network-status" role="status"></p>
          <button id="stop-session" class="stop-button" type="button">停止連線</button>
        </aside>
        <section class="screen-stage" id="screen-stage">
          <div id="connection-notice" class="connection-notice" data-state="idle">等待手機端連線</div>
          <video id="remote-video" autoplay muted playsinline></video>
          <audio id="remote-audio" autoplay></audio>
          <canvas id="annotation-canvas" aria-label="即時標記畫布"></canvas>
          <div id="empty-stage" class="empty-stage">等待手機端開始分享鏡頭</div>
          <div class="annotation-toolbar" aria-label="即時標記工具">
            <span class="toolbar-label">即時標記</span>
            <button class="color-swatch selected" type="button" data-color="#ef4444" style="--swatch:#ef4444" aria-label="紅色標記"></button>
            <button class="color-swatch" type="button" data-color="#f59e0b" style="--swatch:#f59e0b" aria-label="黃色標記"></button>
            <button class="color-swatch" type="button" data-color="#22c55e" style="--swatch:#22c55e" aria-label="綠色標記"></button>
            <button class="color-swatch" type="button" data-color="#38bdf8" style="--swatch:#38bdf8" aria-label="藍色標記"></button>
            <button id="undo-annotation" class="clear-button" type="button">上一步</button>
            <button id="clear-annotations" class="clear-button" type="button">清除</button>
          </div>
        </section>
        <aside class="panel chat-panel"><div class="messages" id="messages" aria-live="polite"></div><form id="message-form" class="message-form"><input id="message-input" placeholder="輸入訊息" autocomplete="off" /><button>傳送</button></form></aside>
      </section>
    </main>
    <dialog id="help-dialog"><div class="help-content"><h2>使用說明</h2><ol><li>手機端開啟頁面後，將 4 位協助代碼提供給主控端。</li><li>主控端輸入代碼加入後，手機端開始分享鏡頭與麥克風。</li><li>每個工作階段只允許一位主控端，最長 30 分鐘；5 分鐘未活動或主控端停止連線即失效。</li><li>請勿分享敏感資料；主控端可使用標記、語音與文字訊息協助。</li></ol><button id="close-help" type="button">關閉</button></div></dialog>
    <script src="./app.js" type="module"></script>
  </body>
</html>
