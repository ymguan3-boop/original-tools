<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>QR Code 管理平台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  color: #e2e8f0;
  display: flex; align-items: center; justify-content: center;
  height: 100vh; overflow: hidden;
  user-select: none;
}
.container { text-align: center; padding: 20px; }
.logo {
  width: 80px; height: 80px; margin: 0 auto 24px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; font-weight: 800; color: #fff;
  box-shadow: 0 8px 32px rgba(99,102,241,0.3);
}
h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 32px; }
.spinner {
  width: 40px; height: 40px; margin: 0 auto 20px;
  border: 3px solid #334155; border-top-color: #6366f1;
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#status {
  font-size: 13px; color: #94a3b8; min-height: 20px;
  transition: all 0.3s;
}
#status.done { color: #34d399; }
.bar-wrap {
  width: 280px; height: 4px; background: #1e293b; border-radius: 2px;
  margin: 16px auto 0; overflow: hidden;
}
.bar-fill {
  height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #8b5cf6);
  border-radius: 2px; transition: width 0.4s ease;
}
.version {
  position: fixed; bottom: 16px; left: 0; right: 0;
  font-size: 11px; color: #475569; text-align: center;
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">QR</div>
  <h1>QR Code 管理平台</h1>
  <div class="subtitle">一站式 QR Code 產生與追蹤管理</div>
  <div class="spinner" id="spinner"></div>
  <div id="status">正在初始化...</div>
  <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
  <div class="version">v1.0.0</div>
</div>
<script>
let pct = 0;
function advance(msg) {
  var el = document.getElementById('status');
  if (msg) el.textContent = msg;
  // advance progress: 0 → 90% (last 10% is "ready")
  if (pct < 90) {
    pct = Math.min(pct + (msg ? 25 : 15), 90);
    document.getElementById('barFill').style.width = pct + '%';
  }
  if (msg && msg.indexOf('就緒') !== -1) {
    document.getElementById('barFill').style.width = '100%';
    document.getElementById('spinner').style.display = 'none';
    el.classList.add('done');
  }
}
</script>
</body>
</html>
